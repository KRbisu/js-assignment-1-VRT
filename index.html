<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Time</title>
  <link rel="stylesheet" href="./styles/style.css">
  <script src="./scripts/script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Reaction Time</h1>
    <p id="attempts">Attempts remaining: 5</p>
    <div id="box" class="box idle">click to start</div>
    <p id="message">Wait for red to turn blue, then click.</p>
    <section id="results" class="hidden">
      <ol id="list"></ol>
      <p id="summary"></p>
      <button id="restart">Play again</button>
    </section>
  </main>
  
</body>
</html>
